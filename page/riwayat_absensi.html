            background-attachment: fixed;
            background-size: cover;
        }

        .card {
            background-color: white;
            color: black;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div id="user-info" class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Informasi User</span>
                <button id="logout-button" class="btn btn-danger btn-sm">Logout</button>
            </div>
            <div class="card-body">
                <h5 class="card-title" id="user-name"></h5>
                <p class="card-text" id="user-details"></p>
            </div>
        </div>
        <div id="krs-info" class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 id="kelas-header" class="mb-0">Kelas</h5>
            </div>
            <div class="card-body">
                <div class="spinner-border text-primary" role="status" id="loading-spinner">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Nama Dosen</th>
                                <th>Tanggal</th>
                                <th>Kode MK</th>
                                <th>Hari</th>
                                <th>Mata Kuliah</th>
                                <th>Jam</th>
                                <th>Jam Masuk</th>
                                <th>Jam Keluar</th>
                            </tr>
                        </thead>
                        <tbody id="krs-table-body">
                        </tbody>
                    </table>
                </div>
                <div class="mt-4">
                    <a href="kelas.html" class="btn btn-secondary">Kembali</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const user = JSON.parse(sessionStorage.getItem('user'));
            const mata_kuliah = JSON.parse(sessionStorage.getItem('mata_kuliah'));
            const url_api = JSON.parse(sessionStorage.getItem('url_api'));

            if (!user || !mata_kuliah) {
                window.location.href = '../login.html';
                return;
            }

            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-details').innerHTML = `
        <strong>Company:</strong> ${user.company}<br>
        <strong>NPM:</strong> ${user.userName}<br>
        <strong>Prodi:</strong> ${user.prodi}<br>
        <strong>API Domain:</strong> ${url_api}<br>
    `;

            document.getElementById('kelas-header').textContent = 'Kelas: ' + mata_kuliah.jadwalKuliah;

            const loadingSpinner = document.getElementById('loading-spinner');
            loadingSpinner.style.display = 'block';

            const url = url_api + `/mahasiswa-web-api-rest/mahasiswa/listAllAbsenDosenByIdJadwalKuliah/${user.token}/${mata_kuliah.idJadwalKuliah}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const absensiTableBody = document.getElementById('krs-table-body');
                    const fetchPromises = data.absenDosen.map(absen => {
                        const absenUrl = url_api + `/mahasiswa-web-api-rest/mahasiswa/getAbsenDosenById/${user.token}/${absen.idAbsenDosen}`;
                        return fetch(absenUrl)
                            .then(response => response.json())
                            .then(absenData => {
                                let statusIcon = '';
                                if (absenData.aktif == 0) {
                                    statusIcon = '<span class="status-ended">Sesi kuliah berakhir</span>';
                                    appendRow(absensiTableBody, absen, statusIcon);
                                    return null; // Supaya tidak masuk ke Promise.all() sebagai undefined
                                } else if (absenData.aktif == 1) {
                                    const mahasiswaUrl = url_api + `/mahasiswa-web-api-rest/mahasiswa/getAbsenMahasiswaByIdAbsenDosen/${user.token}/${absen.idAbsenDosen}`;
                                    return fetch(mahasiswaUrl)
                                        .then(response => response.json())
                                        .then(mahasiswaData => {
                                            if (mahasiswaData.message === "BELUM ADA ABSENSI") {
                                                statusIcon = `<a href="#" class="absen-link" data-id-absen-dosen="${absen.idAbsenDosen}" data-id-jadwal-kuliah="${absen.idJadwalKuliah}" data-id-absen-mahasiswa="${mahasiswaData.id_absen_mahasiswa || 0}">Absen</a>`;
                                            } else if (mahasiswaData.message === null) {
                                                statusIcon = '<span class="icon-status green">&check;</span>';
                                            }
                                            appendRow(absensiTableBody, absen, statusIcon);
                                        });
                                }
                            });
                    });

                    Promise.all(fetchPromises)
                        .finally(() => {
                            // Menonaktifkan spinner setelah semua request selesai
                            loadingSpinner.style.display = 'none';

                            document.querySelectorAll('.absen-link').forEach(link => {
                                link.addEventListener('click', function (event) {
                                    event.preventDefault();
                                    const idAbsenDosen = this.getAttribute('data-id-absen-dosen');
                                    const idJadwalKuliah = this.getAttribute('data-id-jadwal-kuliah');
                                    const idAbsenMahasiswa = this.getAttribute('data-id-absen-mahasiswa');

                                    const absenData = {
                                        id_absen_mahasiswa: idAbsenMahasiswa,
                                        idAbsenDosen: parseInt(idAbsenDosen),
                                        id_jadwal_kuliah: parseInt(idJadwalKuliah),
                                        kehadiran: "Hadir"
                                    };

                                    fetch(url_api + `/mahasiswa-web-api-rest/mahasiswa/saveAbsen/${user.token}`, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify(absenData)
                                    })
                                        .then(response => response.json())
                                        .then(data => {
                                            if (data === 0) {
                                                window.location.href = 'riwayat_absensi.html';
                                            } else {
                                                alert('Gagal melakukan absensi');
                                                window.location.href = 'riwayat_absensi.html';
                                            }
                                        })
                                        .catch(error => {
                                            alert('Gagal melakukan absensi');
                                            console.error('Error saving attendance:', error);
                                            window.location.href = 'riwayat_absensi.html';
                                        });
                                });
                            });
                        });
                })
                .catch(error => {
                    console.error('Error fetching absen dosen:', error);
                    loadingSpinner.style.display = 'none';
                });

            function appendRow(tableBody, absen, statusIcon) {
                const row = document.createElement('tr');
                row.innerHTML = `
            <td>${statusIcon}</td>
            <td>${absen.nm_sdm}</td>
            <td>${absen.strTanggal}</td>
            <td>${absen.kodemk}</td>
            <td>${absen.hari}</td>
            <td>${absen.mtkuliah}</td>
            <td>${absen.jam}</td>
            <td>${absen.strJamMasuk}</td>
            <td>${absen.strJamKeluar}</td>
        `;
                tableBody.appendChild(row);
            }

            document.getElementById('logout-button').addEventListener('click', function () {
                // delete semua cookie
                document.cookie.split(';').forEach(function (c) {
                    document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date().toUTCString() + ';path=/');
                });

                // delete session
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('url_api');

                // redirect
                window.location.href = '../login.html';
            });
        });

    </script>
</body>

</html>
